name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: File size budget
        run: ./scripts/loc_check.sh
      - name: Tests
        run: cargo test --all
      - name: Tests with all features
        run: cargo test --all --all-features
      - name: Fuzz harnesses build
        run: cd fuzz && cargo build --release
      - name: Short differential fuzz campaign
        run: |
          cargo build --release
          # A fixed seed keeps this reproducible; a finding fails the build.
          ./target/release/binspector fuzz --differential rsc/sdl_banned_funct.list \
            --iterations 2000 --seed 20260930 --fail-on-finding

  linux:
    name: Linux (${{ matrix.target }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 toolchain (GNU)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # Exported as env vars rather than written to config.toml: the previous
          # `echo "...\nlinker = ..."` relied on \n being interpreted, which /bin/sh
          # does not do, so it wrote a literal backslash-n and left cargo with
          # unparseable TOML. CC and AR are needed because some dependencies build C.
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact (tar.gz)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          BIN=target/${{ matrix.target }}/release/binspector
          NAME=binspector-${{ matrix.target }}-${{ github.ref_name }}
          tar -czf ${NAME}.tar.gz -C $(dirname "$BIN") $(basename "$BIN") README.md LICENSE || tar -czf ${NAME}.tar.gz -C $(dirname "$BIN") $(basename "$BIN") README.md || tar -czf ${NAME}.tar.gz -C $(dirname "$BIN") $(basename "$BIN")
          echo "asset_path=${NAME}.tar.gz" >> $GITHUB_OUTPUT
        id: package
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset_path }}

  macos:
    name: macOS (${{ matrix.target }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-apple-darwin, aarch64-apple-darwin ]
    # One Apple silicon runner cross-compiles both targets. The previous matrix used
    # macos-13 for x86_64, which GitHub has deprecated; its queue left the x86_64
    # asset unbuilt for v3.0.0.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact (tar.gz)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          cp target/${{ matrix.target }}/release/binspector "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          NAME=binspector-${{ matrix.target }}-${{ github.ref_name }}
          tar -czf "${NAME}.tar.gz" -C "$STAGE" .
          echo "asset_path=${NAME}.tar.gz" >> $GITHUB_OUTPUT
        shell: bash
        id: package
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset_path }}

  windows:
    name: Windows (${{ matrix.target }})
    needs: quality
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-pc-windows-msvc, aarch64-pc-windows-msvc ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact (zip)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/binspector.exe"
          $name = "binspector-${{ matrix.target }}-${{ github.ref_name }}.zip"
          Compress-Archive -Path $bin -DestinationPath $name
          "asset_path=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        id: package
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset_path }}
