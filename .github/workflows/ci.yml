name: CI

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: File size budget
        run: ./scripts/loc_check.sh
      - name: Tests
        run: cargo test --all
      - name: Tests with all features
        run: cargo test --all --all-features
      - name: Clippy with all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Every optional feature is on by default since 4.4.0, so the cfg-gated code paths
      # are no longer exercised by an ordinary build. Without this the fallbacks rot: the
      # "no SQLite support" message, `--format all` skipping what it cannot write, and the
      # --carve rejection all live behind #[cfg(not(feature = ...))].
      - name: Tests without default features
        run: cargo test --all --no-default-features
      - name: Clippy without default features
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Fuzz harnesses build
        run: cargo build --release --bins
      - name: Short differential fuzz campaign
        run: |
          cargo build --release
          # A fixed seed keeps this reproducible; a finding fails the build.
          ./target/release/binspector fuzz --differential rsc/sdl_banned_funct.list \
            --iterations 2000 --seed 20260930 --fail-on-finding

  linux:
    name: Linux (${{ matrix.target }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 toolchain (GNU)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # Exported as env vars rather than written to config.toml: the previous
          # `echo "...\nlinker = ..."` relied on \n being interpreted, which /bin/sh
          # does not do, so it wrote a literal backslash-n and left cargo with
          # unparseable TOML. CC and AR are needed because some dependencies build C.
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/binspector
          NAME=binspector-${{ matrix.target }}-${{ github.ref_name }}
          # Staged rather than assembled with -C, which previously pointed at
          # target/release where README.md and LICENSE do not exist, so the archive
          # silently shipped the binary alone. The license has to travel with the
          # binary now that the crate is GPL-3.0.
          STAGE=$(mktemp -d)
          cp "$BIN" README.md LICENSE "$STAGE/"
          tar -czf "${NAME}.tar.gz" -C "$STAGE" .
          # A bare binary alongside the archive, for scripted installs.
          cp "$BIN" "./${NAME}"
          {
            echo "archive=${NAME}.tar.gz"
            echo "bare=${NAME}"
          } >> "$GITHUB_OUTPUT"
        id: package
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.bare }}

  macos:
    name: macOS (${{ matrix.target }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-apple-darwin, aarch64-apple-darwin ]
    # One Apple silicon runner cross-compiles both targets. The previous matrix used
    # macos-13 for x86_64, which GitHub has deprecated; its queue left the x86_64
    # asset unbuilt for v3.0.0.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact (tar.gz)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          cp target/${{ matrix.target }}/release/binspector "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          NAME=binspector-${{ matrix.target }}-${{ github.ref_name }}
          tar -czf "${NAME}.tar.gz" -C "$STAGE" .
          # A bare binary alongside the archive, for scripted installs.
          cp "target/${{ matrix.target }}/release/binspector" "./${NAME}"
          {
            echo "archive=${NAME}.tar.gz"
            echo "bare=${NAME}"
          } >> "$GITHUB_OUTPUT"
        shell: bash
        id: package
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.bare }}

  windows:
    name: Windows (${{ matrix.target }})
    needs: quality
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-pc-windows-msvc, aarch64-pc-windows-msvc ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin  = "target/${{ matrix.target }}/release/binspector.exe"
          $name = "binspector-${{ matrix.target }}-${{ github.ref_name }}"
          # Staged so the zip carries the license and readme. Compress-Archive was
          # previously handed the binary alone, which shipped a GPL binary with no
          # license text.
          $stage = Join-Path $env:RUNNER_TEMP "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $bin, "README.md", "LICENSE" -Destination $stage
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "$name.zip" -Force
          # A bare executable alongside the archive, for scripted installs.
          Copy-Item $bin -Destination "./$name.exe"
          "archive=$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "bare=$name.exe"    | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        id: package
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.bare }}

  docs-assets:
    name: Standalone LICENSE and README
    needs: quality
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LICENSE
            README.md
            usage.md
