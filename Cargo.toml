[package]
name = "binspector"
version = "4.1.0"
edition = "2021"
description = "Inspect binaries for banned C/C++ functions and exploit mitigations, unpacking nested containers, with PE analysis, reputation and CVE enrichment, and fuzzing"
license = "MIT"
repository = "https://github.com/gbiagomba/Binspector"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
regex = "1.11"
aho-corasick = "1.1"
zip = "8.6"
tempfile = "3.27"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
goblin = "0.10.7"
flate2 = "1.1.10"
bzip2 = "0.6.1"
zstd = "0.14.0"
lzma-rust2 = "0.21.0"
sevenz-rust2 = "0.23.0"
cab = "0.6.0"
binwalk-ng = { version = "4.0.0", default-features = false, optional = true }

[dev-dependencies]
assert_cmd = "2.0"
flate2 = "1.1.10"
predicates = "3.1"
serde_json = "1.0"
zip = "8.6"

[features]
default = []
# Binary SQLite report output (`--format sqlite`). Off by default because the
# bundled SQLite amalgamation costs significant build time and disk. The `sql`
# text format needs no feature and produces an equivalent, loadable dump.
# Enable with: cargo build --features sqlite
sqlite = ["dep:rusqlite"]
# Signature-based carving of embedded data in formats Binspector does not parse,
# via the binwalk library. Off by default: the ZIP family plus the single-stream
# and archive formats above already cover ordinary application bundles, and carving
# is a firmware-analysis tool that produces a lot of output on other input.
carve = ["dep:binwalk-ng"]
ureq = []
binwalk-ng = ["dep:binwalk-ng"]

[profile.release]
lto = true
codegen-units = 1
