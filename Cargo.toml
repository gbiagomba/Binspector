[package]
name = "binspector"
version = "3.0.0"
edition = "2021"
description = "Inspect binaries for banned C/C++ functions, unpacking nested containers and reporting token-accurate matches"
license = "MIT"
repository = "https://github.com/gbiagomba/Binspector"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
regex = "1.11"
aho-corasick = "1.1"
zip = "8.6"
tempfile = "3.27"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"
zip = "8.6"

[features]
default = []
# Binary SQLite report output (`--format sqlite`). Off by default because the
# bundled SQLite amalgamation costs significant build time and disk. The `sql`
# text format needs no feature and produces an equivalent, loadable dump.
# Enable with: cargo build --features sqlite
sqlite = ["dep:rusqlite"]

[profile.release]
lto = true
codegen-units = 1
