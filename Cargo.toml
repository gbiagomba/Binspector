[package]
name = "binspector"
version = "5.0.0"
edition = "2021"
description = "Inspect binaries for banned C/C++ functions and exploit mitigations, unpacking nested containers, with PE analysis, reputation and CVE enrichment, and fuzzing"
license = "GPL-3.0-or-later"
repository = "https://github.com/gbiagomba/Binspector"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "local-offset"] }
regex = "1.11"
aho-corasick = "1.1"
zip = "8.6"
tempfile = "3.27"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
goblin = "0.10.7"
flate2 = "1.1.10"
bzip2 = "0.6.1"
zstd = "0.14.0"
lzma-rust2 = "0.21.0"
sevenz-rust2 = "0.23.0"
cab = "0.6.0"
binwalk-ng = { version = "4.0.0", default-features = false, optional = true }
arbitrary = { version = "1.4.2", features = ["derive"] }
rustyline = { version = "18.0.1", optional = true }
# Authenticode signer identity: PKCS#7 / CMS SignedData down to the X.509 subject CN, so a
# report can say whose code a finding is in. goblin hands over the raw blob and does no ASN.1.
#
# `cms` 0.3 is the line that pairs with der 0.8 and x509-cert 0.3 and reuses the const-oid
# 0.10 already in the lock via `digest`. It is a pre-release, so it is pinned exactly: the
# version is then reproducible rather than floating, which is the condition under which a
# pre-release is acceptable in a tool that ships binaries. Parsing failure is never fatal, and
# `--first-party` covers attribution without it.
cms = { version = "=0.3.0-pre.2", features = ["std"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["std"] }
der = { version = "0.8.2", default-features = false, features = ["alloc", "oid", "std"] }

[[bin]]
name = "binspector"
path = "src/main.rs"

[[bin]]
name = "fuzz_strings"
path = "src/bin/fuzz_strings.rs"
test = false
doc = false

[[bin]]
name = "fuzz_container"
path = "src/bin/fuzz_container.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pe"
path = "src/bin/fuzz_pe.rs"
test = false
doc = false

[dev-dependencies]
assert_cmd = "2.0"
flate2 = "1.1.10"
predicates = "3.1"
serde_json = "1.0"
zip = "8.6"

[features]
# Everything ships in a default build, so a released binary can write every format,
# browse a report, and carve. Each feature is still separable for a minimal build:
# `--no-default-features` drops all three, and the gates below still compile.
default = ["sqlite", "carve", "repl"]
# Binary SQLite report output (`--format sqlite`). Costs the bundled SQLite
# amalgamation, which needs a C compiler and is the bulk of a cold build. The `sql`
# text format needs no feature and produces an equivalent, loadable dump, so a
# minimal build loses no information.
sqlite = ["dep:rusqlite"]
# Signature-based carving of embedded data in formats Binspector does not parse,
# via the binwalk library. Compiled in by default, but `--carve` stays opt-in at
# runtime: carving is a firmware-analysis technique and produces a great deal of
# low-value output on an ordinary application bundle.
carve = ["dep:binwalk-ng"]
# Interactive browser over a saved report (`binspector repl scan.json`). Adds a
# line editor; everything it shows is already in the report.
repl = ["dep:rustyline"]

[profile.release]
lto = true
codegen-units = 1
