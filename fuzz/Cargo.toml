[package]
name = "binspector-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "Coverage-guided fuzz targets for Binspector's parsers"

# Kept out of the workspace so `cargo test` at the root does not try to build
# instrumented targets, which need cargo-afl or cargo-hfuzz to be installed.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
binspector = { path = ".." }
arbitrary = { version = "1.4", features = ["derive"] }
afl = { version = "0.18", optional = true }
honggfuzz = { version = "0.5", optional = true }
libfuzzer-sys = { version = "0.4", optional = true }

[features]
default = []
afl-target = ["dep:afl"]
hfuzz-target = ["dep:honggfuzz"]
libfuzzer-target = ["dep:libfuzzer-sys"]

[[bin]]
name = "fuzz_strings"
path = "fuzz_targets/fuzz_strings.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_container"
path = "fuzz_targets/fuzz_container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pe"
path = "fuzz_targets/fuzz_pe.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
